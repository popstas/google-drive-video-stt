services:
  google-drive-video-stt:
    build: .
    image: google-drive-video-stt:latest
    container_name: google-drive-video-stt
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    tmpfs:
      - /tmp
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
