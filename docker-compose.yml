services:
  google-drive-video-stt:
    build: .
    image: google-drive-video-stt:latest
    container_name: google-drive-video-stt
    restart: unless-stopped
    environment:
      # The image already bakes GDSTT_HOME=/app/data; set it here too so the
      # config resolver reads config.yml and credentials.json/token.json from
      # the mounted ./data volume.
      GDSTT_HOME: /app/data
    volumes:
      - ./data:/app/data
    ports:
      # The call-booking receiver. Keep it behind a reverse proxy that terminates TLS:
      # the bearer token and the booking payload must not cross the network in plain
      # text. Change both sides together with call_booking.listen_port in config.yml.
      - "8080:8080"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
